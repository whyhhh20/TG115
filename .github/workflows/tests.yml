name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Unit and scenario tests
        run: >
          uv run
          --with-requirements requirements-build.txt
          --with-requirements payload/requirements.txt
          python -m unittest discover -s tests -v

      - name: Ruff
        run: uv run --with ruff==0.16.0 ruff check installer.py payload/app tests

      - name: Bandit
        run: uv run --with bandit==1.9.4 bandit -q -r payload/app installer.py

      - name: Dependency audit
        run: |
          uv run --with pip-audit==2.10.1 pip-audit -r payload/requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit -r requirements-build.txt

      - name: Build and self-test Windows EXE
        shell: pwsh
        run: |
          ./build.ps1
          $result = Join-Path $env:RUNNER_TEMP "tg115-self-test.txt"
          $process = Start-Process `
            -FilePath "./dist/TG115-Deployer.exe" `
            -ArgumentList @("--self-test", "--self-test-result", $result) `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "EXE self-test exited with $($process.ExitCode)"
          }
          $content = Get-Content -LiteralPath $result -Raw -Encoding utf8
          if ($content -notmatch "result=OK") {
            throw "EXE self-test did not report OK"
          }

  linux-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck \
            payload/remote_install.sh \
            payload/repair_clouddrive_network.sh \
            payload/manage.sh

      - name: Validate Compose
        run: |
          touch payload/.env
          docker compose -f payload/docker-compose.yml config --quiet

      - name: Build Linux Bot image
        run: docker build -t tg115-bot:test payload
